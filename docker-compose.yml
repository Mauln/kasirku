services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kasirku-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/kasirku.ini:ro
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kasirku_net

  nginx:
    image: nginx:1.28-alpine
    container_name: kasirku-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - kasirku_net

  mysql:
    image: mysql:8.4
    container_name: kasirku-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kasirku_local}
      MYSQL_USER: ${DB_USERNAME:-kasirku}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kasirku_local_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-kasirku_root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/kasirku.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kasirku_net

  redis:
    image: redis:7.4-alpine
    container_name: kasirku-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kasirku_net

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kasirku-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--queue=default,analytics", "--sleep=3", "--tries=3", "--timeout=30"]
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kasirku_net

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kasirku-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kasirku_net

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: kasirku-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kasirku_net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  kasirku_net:
    driver: bridge
