version: '3.8'

services:
  app:
    build: ./docker/php
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - kasirku

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - kasirku

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: kasirku_local
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - kasirku

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    networks:
      - kasirku

  queue:
    build: ./docker/php
    command: php artisan queue:work --queue=default,analytics --sleep=3 --tries=3
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - kasirku

  scheduler:
    build: ./docker/php
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - kasirku

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: secret
    depends_on:
      - mysql
    networks:
      - kasirku

volumes:
  mysql_data:

networks:
  kasirku:
    driver: bridge
