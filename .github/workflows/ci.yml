name: CI — Kasirku v2.0 (11 Langkah Wajib)

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-pipeline:
    name: CI 11 Langkah Kasirku
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: kasirku_test
          MYSQL_USER: kasirku
          MYSQL_PASSWORD: kasirku_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, redis, bcmath, intl, zip
          coverage: pcov

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Composer dependencies (if Laravel vendor/artisan initialized)
        if: hashFiles('artisan') != ''
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
            php artisan key:generate --force
          fi

      - name: Install NPM dependencies
        run: npm ci

      # ========================================================================
      # LANGKAH 1: Lint PHP (Laravel Pint)
      # ========================================================================
      - name: "1/11 Lint PHP (Pint)"
        run: |
          if [ -f vendor/bin/pint ]; then
            ./vendor/bin/pint --test
          else
            echo "Laravel vendor not yet installed in 0A skeleton — skipping Pint runtime until local composer install."
          fi

      # ========================================================================
      # LANGKAH 2: Lint JS Vanilla (ESLint 9+ Flat Config)
      # ========================================================================
      - name: "2/11 Lint JS Vanilla (ESLint)"
        run: |
          npm run lint:js
          node scripts/build-vanilla.mjs --verify-only

      # ========================================================================
      # LANGKAH 3: Lint CSS (Stylelint Token & BEM Compliance)
      # ========================================================================
      - name: "3/11 Lint CSS (Stylelint)"
        run: npm run lint:css

      # ========================================================================
      # LANGKAH 4: Format Check (Prettier)
      # ========================================================================
      - name: "4/11 Format Check (Prettier)"
        run: npm run format:check

      # ========================================================================
      # LANGKAH 5: Test Backend (Pest)
      # ========================================================================
      - name: "5/11 Test Backend (Pest)"
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: kasirku_test
          DB_USERNAME: kasirku
          DB_PASSWORD: kasirku_ci_password
          REDIS_HOST: 127.0.0.1
        run: |
          if [ -f vendor/bin/pest ]; then
            ./vendor/bin/pest
          else
            echo "Pest will run once Laravel vendor + Sub-Fase 0B tests are initialized."
          fi

      # ========================================================================
      # LANGKAH 6: Test JS Vanilla (node:test)
      # ========================================================================
      - name: "6/11 Test JS Vanilla"
        run: npm test

      # ========================================================================
      # LANGKAH 7: Audit Dependency (composer audit + npm audit)
      # ========================================================================
      - name: "7/11 Audit Dependency"
        run: |
          npm audit --audit-level=high
          if [ -f composer.lock ]; then
            composer audit
          fi

      # ========================================================================
      # LANGKAH 8: Secret Scan (Gitleaks)
      # ========================================================================
      - name: "8/11 Secret Scan (Gitleaks)"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================================
      # LANGKAH 9: Image Scan (Trivy)
      # ========================================================================
      - name: "9/11 Container & Config Scan (Trivy)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH"

      # ========================================================================
      # LANGKAH 10: Guard Rules Dry-Run (app:check-production)
      # ========================================================================
      - name: "10/11 Guard Rules Dry-Run"
        run: |
          if [ -f artisan ]; then
            APP_ENV=production GUARD_RULES_ENFORCED=true php artisan app:check-production --dry-run || true
          else
            echo "Guard rules command app:check-production will be implemented in Sub-Fase 0B."
          fi

      # ========================================================================
      # LANGKAH 11: Coverage Check
      # ========================================================================
      - name: "11/11 Coverage Check"
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: kasirku_test
          DB_USERNAME: kasirku
          DB_PASSWORD: kasirku_ci_password
          REDIS_HOST: 127.0.0.1
        run: |
          if [ -f vendor/bin/pest ]; then
            mkdir -p build/logs
            ./vendor/bin/pest --coverage --coverage-clover=build/logs/clover.xml
            php scripts/check-coverage.php build/logs/clover.xml
          else
            echo "Backend coverage gate activates with Sub-Fase 0B+ feature suites."
          fi
